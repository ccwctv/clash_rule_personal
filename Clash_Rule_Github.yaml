# ==============================================
# 端口配置
# ==============================================
allow-lan: true
mode: rule
tcp-concurrent: true
unified-delay: true
log-level: info
ipv6: true
# 注意：这里写的 secret 必须和 OpenClash 面板里填的一致，否则自己也进不去。
#external-controller: 0.0.0.0:9090
#secret: "251147"

# ==============================================
# DNS 设置
# ==============================================
dns:
  enable: true
  #listen: 0.0.0.0:53
  #ipv6: true
  # —— default-nameserver（引导DNS，必须是IP）——
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    #- 114.114.114.114
  # —— nameserver（主DNS，国内低延迟加密）——
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    '+.services.googleapis.cn':
      - https://8.8.8.8/dns-query#RULES
      - https://dns.google/dns-query#RULES
    '+.googleapis.cn':
      - https://8.8.8.8/dns-query#RULES
      - https://dns.google/dns-query#RULES
    '+.xn--ngstr-lra8j.com':
      - https://8.8.8.8/dns-query#RULES
      - https://dns.google/dns-query#RULES
      
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
  # PlayStore
    - +.googleapis.cn
    - +.services.googleapis.cn
    - +.xn--ngstr-lra8j.com
  # Microsoft
  # DDNS
    - +.daengngoenz.cn
  # 机场    
    - +.azumase.ren
    - +.ss.mba    


# ========================
# 策略组定义
# ========================
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# 注意：select 组不写 default-selected 时，默认值 = 列表第一项。
# 原配置把「直连」放第一位 —— 换配置 / 清缓存 / 重启内核后，
# Google、AI、Streaming、Others 会全部回落到直连，
# 表现就是「别的服务都可用，只有 Google 检测失败、Play 商店一直转圈」。
default: &default
  type: select
  proxies:
    - 低倍-故转
    - 港台-故转
    - 新日-故转
    - 美国-故转
    - 所有-手动
    #- 所有-自动
    - 直连
    - 拒绝

proxy-groups:

  # 业务分流组
  - {name: YouTube, <<: *default}        # 观看BWF比赛
  - {name: Google, <<: *default}         # 谷歌、OneDrive、Github等高速、低流量需求的网站论坛

  # 低倍率组
  - name: 低倍-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 低倍-手动
      - 低倍-自动
  - name: 低倍-手动
    type: select
    include-all: true
    filter: "^(?=.*(0\\.1|0\\.25|0\\.5|0\\.3|0\\.|低倍率))(?!(.*(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|过滤|更新))).*$"
  - name: 低倍-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^(?=.*(0\\.1|0\\.25|0\\.5|0\\.3|0\\.|低倍率))(?!(.*(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|过滤|更新))).*$"
  
  # 港台组
  - name: 港台-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 港台-手动
      - 港台-自动
  - name: 港台-手动
    type: select
    include-all: true
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan)).*$"
  - name: 港台-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan)).*$"

  # 新日组
  - name: 新日-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 新日-手动
      - 新日-自动
  - name: 新日-手动
    type: select
    include-all: true
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
  - name: 新日-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  # 美国组
  - name: 美国-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 美国-手动
      - 美国-自动
  - name: 美国-手动
    type: select
    include-all: true
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|澳大利亚|Australia|澳洲|AU|AUS)).*$"
  - name: 美国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|澳大利亚|Australia|澳洲|AU|AUS)).*$"

  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|直连)).)*$"
  #- name: 所有-自动
    #type: url-test
    #include-all: true
    #tolerance: 50
    #interval: 300
    #filter: "^((?!(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|直连)).)*$"
      
  - {name: Microsoft, <<: *default}
  #- {name: PlayStore, <<: *default}
  - {name: Telegram, <<: *default}       # 低倍率  
  - {name: EmbyServer, <<: *default}         
  - {name: Others, <<: *default}
  - {name: SNS, <<: *default}          # Twitter、Facebook、TikTok、Reddit等社交网络，有一定流量需求
  - {name: AI, <<: *default}
  - {name: Streaming, <<: *default}  # 流媒体
  - {name: Game, <<: *default}         # 游戏平台，包括Steam  
  #- {name: Test, <<: *default}         # 测速、测试IP
  #- {name: Spotify, <<: *default}
  #- {name: Nvidia, <<: *default}
  #- {name: Apple, <<: *default}
  #- {name: BiliBili, <<: *default}
  - {name: 国内, <<: *default}

