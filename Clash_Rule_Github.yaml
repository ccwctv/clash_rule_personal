# ==============================================
# 机场订阅
# ==============================================
p: &p
  type: http
  # 自动更新订阅时间，单位为秒
  interval: 10800
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    # 节点连通性检测时间，单位为秒
    interval: 300
    # 节点超时延迟，单位为毫秒
    # timeout: 1000
    # 节点自动切换差值，单位为毫秒
    tolerance: 150
  # proxy: 直连 

# 机场节点订阅
proxy-providers:

  00 Yukihasu:
    <<: *p
    # path: ./proxy_provider/00 Yukihasu.yaml  # 本地缓存路径
