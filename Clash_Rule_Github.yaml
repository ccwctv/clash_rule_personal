# ========================
# Clash-ALL 优化配置
# ========================
p: &p
  type: http
  # 自动更新订阅时间，单位为秒
  interval: 10800
  health-check:
    enable: true
    # url: https://cp.cloudflare.com
    url: https://www.gstatic.com/generate_204
    # 节点连通性检测时间，单位为秒
    interval: 300
    # 节点超时延迟，单位为毫秒
    # timeout: 1000
    # 节点自动切换差值，单位为毫秒
    tolerance: 150
  # proxy: 直连 

# 机场节点订阅
# 订阅后面 &flag=clash-provider 就是纯节点模式（未验证）
proxy-providers:

  00 Yukihasu:
    <<: *p
    # path: ./proxy_provider/00 Yukihasu.yaml
    override:
      additional-prefix: "YK | "
    url: "https://8f9e4c8a8bd4519853e591466"

  01 teacat:
    <<: *p
    override:
      additional-prefix: "TC | "
    url: "http33cb2a383c3a70062c7513f2f321"

  02 ShenLong:
    <<: *p
    override:
      additional-prefix: "SL | "
    url: "httaf33de41d17bb36b1450"
    
  03 eggtart:
    <<: *p
    override:
      additional-prefix: "EG | "
    url: "http40f91b2bfe3a1485c502c"
    #proxy: 低倍率-故转 

  04 ssLinks:
    <<: *p
    override:
      additional-prefix: "SS | "
    url: "httef63a3aaf42d97a6728afa1fe68"

  05 newbee:
    <<: *p
    override:
      additional-prefix: "NB | "
    url: "http76038759230097ff5bd0cca5"

  06 dhh:
    <<: *p
    override:
      additional-prefix: "DH | "
    url: "httpdf359251b03136a283"

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
ipv6: true

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  #listen: 0.0.0.0:53
  #ipv6: true
  # —— default-nameserver（引导DNS，必须是IP）——
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    #- 114.114.114.114
  # —— nameserver（主DNS，国内低延迟加密）——
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
  # PlayStore
    #- +.googleapis.cn
    #- +.xn--ngstr-lra8j.com

# ========================
# 策略组定义
# ========================
proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

default: &default
  type: select
  proxies:
    - 直连
    - 低倍率-故转
    - 香港-故转
    - 新加坡-故转
    - 日本-故转
    - 台湾-故转
    - 美国-故转
    - 澳大利亚-故转
    - 所有-手动
    - 所有-自动
    - 其他-故转
    - 拒绝

proxy-groups:
  # 业务分流组
  - {name: YouTube, <<: *default}        # 观看BWF比赛
  - {name: Telegram, <<: *default}       # 低倍率
  - {name: Google, <<: *default}         # 谷歌、OneDrive、Github等高速、低流量需求的网站论坛
  - {name: EmbyServer, <<: *default}         
  - {name: Microsoft, <<: *default}
  - {name: Test, <<: *default}         # 测速、测试IP
  - {name: 国外, <<: *default}
  - {name: 其他, <<: *default}
  
  # 低倍率组
  - name: 低倍率-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 低倍率-手动
      - 低倍率-自动
  
  - name: 低倍率-手动
    type: select
    include-all: true
    filter: "^(?=.*(0\\.1|0\\.25|0\\.5|0\\.3|0\\.|低倍率))(?!(.*(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|过滤|更新))).*$"

  - name: 低倍率-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^(?=.*(0\\.1|0\\.25|0\\.5|0\\.3|0\\.|低倍率))(?!(.*(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|过滤|更新))).*$"
  

  # 香港组
  - name: 香港-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 香港-手动
      - 香港-自动
  
  - name: 香港-手动
    type: select
    include-all: true
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
    
  - name: 香港-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
  
  # 新加坡组
  - name: 新加坡-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 新加坡-手动
      - 新加坡-自动
  - name: 新加坡-手动
    type: select
    include-all: true
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
  - name: 新加坡-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"

  # 日本组
  - name: 日本-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 日本-手动
      - 日本-自动
  - name: 日本-手动
    type: select
    include-all: true
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
  - name: 日本-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  # 台湾组
  - name: 台湾-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 台湾-手动
      - 台湾-自动
  - name: 台湾-手动
    type: select
    include-all: true
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"
  - name: 台湾-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"

  # 美国组
  - name: 美国-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 美国-手动
      - 美国-自动
  - name: 美国-手动
    type: select
    include-all: true
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"
  - name: 美国-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

# 澳大利亚组
  - name: 澳大利亚-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 澳大利亚-手动
      - 澳大利亚-自动
  - name: 澳大利亚-手动
    type: select
    include-all: true
    filter: "(?=.*(澳大利亚|Australia|澳洲|AU|AUS)).*$"
  - name: 澳大利亚-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?=.*(澳大利亚|Australia|澳洲|AU|AUS)).*$"

  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐)).)*$"
    
  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐)).)*$"

  # 其他组
  - name: 其他-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 其他-手动
      - 其他-自动
  - name: 其他-手动
    type: select
    include-all: true
    filter: "^((?!(.*(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|过滤|更新|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States))).)*$"
  - name: 其他-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(.*(包含|拒绝|剩余|官网|网站|客户端|如果|com|Traffic|流量|套餐|过滤|更新|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States))).)*$"

  - {name: SNS, <<: *default}          # Twitter、Facebook、TikTok、Reddit等社交网络，有一定流量需求
  - {name: AI, <<: *default}
  - {name: Streaming, <<: *default}  # 流媒体
  - {name: Game, <<: *default}         # 游戏平台，包括Steam  
