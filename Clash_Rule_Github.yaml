    <<: *p
    override:
      additional-prefix: "CX | "
    url: "https://xn--914e6c413"
    
  02 ShenLong:
    <<: *p
    override:
      additional-prefix: "SL | "
    url: "https://inter7bb36b1450"
    
  03 赔钱机场:
